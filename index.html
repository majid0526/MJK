<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="apple-mobile-web-app-capable" content="yes">

<title>🧠 فلش‌کارت هوشمند</title>
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  :root {
    --theme-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
    --theme-primary: #667eea;
    --theme-secondary: #764ba2;
    --theme-accent: #f093fb;
    --text-color: #ffffff;
    --card-bg: rgba(255,255,255,0.1);
  }
  
  body.theme-purple {
    --theme-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
    --theme-primary: #667eea; --theme-secondary: #764ba2; --theme-accent: #f093fb;
  }
  body.theme-green {
    --theme-gradient: linear-gradient(135deg, #11998e 0%, #38ef7d 50%, #a8ff78 100%);
    --theme-primary: #11998e; --theme-secondary: #38ef7d; --theme-accent: #a8ff78;
  }
  body.theme-blue {
    --theme-gradient: linear-gradient(135deg, #2193b0 0%, #6dd5ed 50%, #a1c4fd 100%);
    --theme-primary: #2193b0; --theme-secondary: #6dd5ed; --theme-accent: #a1c4fd;
  }
  body.theme-pink {
    --theme-gradient: linear-gradient(135deg, #ee9ca7 0%, #ffdde1 50%, #fbc2eb 100%);
    --theme-primary: #ee9ca7; --theme-secondary: #fbc2eb; --theme-accent: #ffdde1;
  }
  body.theme-orange {
    --theme-gradient: linear-gradient(135deg, #f12711 0%, #f5af19 50%, #ffd200 100%);
    --theme-primary: #f12711; --theme-secondary: #f5af19; --theme-accent: #ffd200;
  }
  body.theme-dark {
    --theme-gradient: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
    --theme-primary: #302b63; --theme-secondary: #24243e; --theme-accent: #6c5ce7;
  }
  
  body {
    font-family: 'Vazirmatn', Tahoma, sans-serif;
    background: var(--theme-gradient);
    background-attachment: fixed;
    min-height: 100vh;
    color: white;
    padding: 20px;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    transition: background 0.5s;
  }
  body.lang-en { direction: ltr; }
  body.lang-en .choice-btn { text-align: left; }
  body.lang-en .card-item::before { right: auto; left: 0; }

  .container {
    max-width: 650px;
    width: 100%;
    background: rgba(255,255,255,0.1);
    backdrop-filter: blur(20px);
    border-radius: 28px;
    padding: 30px;
    border: 1px solid rgba(255,255,255,0.2);
    box-shadow: 0 25px 70px rgba(0,0,0,0.3);
    animation: fadeIn 0.6s;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ===== دکمه‌های رنگین‌کمانی ===== */
  .btn-rainbow {
    background: linear-gradient(90deg, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #9400d3, #ff0000);
    background-size: 200% 100%;
    animation: rainbowMove 3s linear infinite;
    color: white;
    text-shadow: 0 1px 3px rgba(0,0,0,0.5);
    box-shadow: 0 5px 20px rgba(0,0,0,0.2);
  }
  @keyframes rainbowMove {
    0% { background-position: 0% 50%; }
    100% { background-position: 200% 50%; }
  }
  .btn-rainbow:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    animation-duration: 1s;
  }

  /* ===== صفحه‌ی اسم ===== */
  .name-screen { text-align: center; padding: 30px 10px; }
  .name-screen h1 {
    font-size: 32px; margin-bottom: 15px;
    text-shadow: 0 0 30px rgba(255,255,255,0.5);
  }
  .name-screen p { color: rgba(255,255,255,0.8); margin-bottom: 20px; font-size: 14px; }
  .name-input {
    width: 100%; padding: 16px 20px; border-radius: 14px;
    border: 2px solid rgba(255,255,255,0.3); background: rgba(0,0,0,0.2);
    color: white; font-family: 'Vazirmatn', Tahoma; font-size: 16px;
    text-align: center; margin-bottom: 20px; transition: all 0.3s;
  }
  .name-input:focus { outline: none; border-color: white; box-shadow: 0 0 25px rgba(255,255,255,0.4); }
  .name-input::placeholder { color: rgba(255,255,255,0.5); }

  /* ===== دکمه‌ها ===== */
  .btn {
    padding: 14px 28px; border: none; border-radius: 14px;
    font-family: 'Vazirmatn', Tahoma; font-size: 15px; font-weight: bold;
    cursor: pointer; transition: all 0.3s;
    display: inline-flex; align-items: center; gap: 8px; justify-content: center;
  }
  .btn-secondary {
    background: rgba(255,255,255,0.15); color: white;
    border: 2px solid rgba(255,255,255,0.2);
  }
  .btn-secondary:hover { background: rgba(255,255,255,0.25); transform: translateY(-2px); }
  .btn-full { width: 100%; }

  /* ===== هدر ===== */
  .header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 20px; flex-wrap: wrap; gap: 10px;
  }
  .greeting { font-size: 18px; font-weight: bold; }
  .greeting span { color: #fff; text-shadow: 0 0 15px rgba(255,255,255,0.5); }
  .header-actions { display: flex; gap: 8px; }
  .icon-btn {
    background: rgba(255,255,255,0.15);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 12px; padding: 8px 12px;
    color: white; font-size: 18px; cursor: pointer;
    transition: all 0.3s;
    display: flex; align-items: center; justify-content: center;
  }
  .icon-btn:hover { background: rgba(255,255,255,0.3); transform: scale(1.1); }

  /* ===== آمار ===== */
  .stats {
    display: flex; gap: 8px; font-size: 11px; flex-wrap: wrap;
    margin-bottom: 15px;
  }
  .stat {
    background: rgba(0,0,0,0.25); padding: 6px 12px;
    border-radius: 10px; border: 1px solid rgba(255,255,255,0.15);
  }
  .stat span { color: #fff; font-weight: bold; }

  /* ===== کارت ===== */
  .card-container { perspective: 1000px; margin-bottom: 25px; min-height: 280px; }
  .card {
    width: 100%; min-height: 280px; position: relative;
    transform-style: preserve-3d; transition: transform 0.7s; cursor: pointer;
  }
  .card.flipped { transform: rotateY(180deg); }
  .card-face {
    position: absolute; width: 100%; min-height: 280px;
    backface-visibility: hidden; border-radius: 22px;
    padding: 30px 25px; display: flex; flex-direction: column;
    justify-content: center; align-items: center; text-align: center;
    box-shadow: 0 15px 40px rgba(0,0,0,0.3);
    border: 2px solid rgba(255,255,255,0.3);
  }
  .card-front { background: var(--theme-gradient); color: white; }
  .card-back { background: rgba(255,255,255,0.95); color: #1a1a2e; transform: rotateY(180deg); }
  .card-label {
    font-size: 11px; letter-spacing: 2px; opacity: 0.9;
    margin-bottom: 15px; text-transform: uppercase;
  }
  .card-text {
    font-size: 24px; font-weight: bold; line-height: 1.5;
    word-wrap: break-word; max-width: 100%;
  }
  .card-hint { font-size: 11px; opacity: 0.7; margin-top: 20px; }

  /* ===== دکمه‌های پاسخ ===== */
  .answer-buttons {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 10px; margin-bottom: 15px;
  }
  .answer-buttons.hidden { display: none; }
  .btn-wrong {
    background: linear-gradient(135deg, #ff6b6b, #ee5a24);
    color: white; box-shadow: 0 5px 20px rgba(255,107,107,0.4);
  }
  .btn-right {
    background: linear-gradient(135deg, #00b894, #00cec9);
    color: white; box-shadow: 0 5px 20px rgba(0,184,148,0.4);
  }

  /* ===== نوار پیشرفت ===== */
  .progress-bar {
    height: 8px; background: rgba(0,0,0,0.25);
    border-radius: 4px; overflow: hidden; margin-bottom: 20px;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--theme-accent), var(--theme-secondary));
    border-radius: 4px; transition: width 0.5s; width: 0%;
  }

  /* ===== منوی پایین ===== */
  .bottom-menu {
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: 8px; margin-top: 15px;
  }
  .menu-btn {
    padding: 12px 8px; background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.2); border-radius: 12px;
    color: white; font-family: 'Vazirmatn', Tahoma; font-size: 12px;
    cursor: pointer; transition: all 0.3s;
  }
  .menu-btn:hover { background: rgba(255,255,255,0.2); transform: translateY(-2px); }

  /* ===== مودال ===== */
  .modal {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.7); backdrop-filter: blur(5px);
    display: none; justify-content: center; align-items: center;
    z-index: 100; padding: 20px;
  }
  .modal.visible { display: flex; }
  .modal-content {
    background: var(--theme-gradient);
    border-radius: 24px; padding: 30px;
    max-width: 500px; width: 100%; max-height: 85vh; overflow-y: auto;
    border: 1px solid rgba(255,255,255,0.2);
    box-shadow: 0 25px 70px rgba(0,0,0,0.5);
    animation: slideUp 0.4s;
  }
  @keyframes slideUp {
    from { transform: translateY(50px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }
  .modal h2 { margin-bottom: 20px; font-size: 22px; text-align: center; }
  .modal-input, .modal-textarea, .modal-select {
    width: 100%; padding: 14px; border-radius: 12px;
    border: 2px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.2);
    color: white; font-family: 'Vazirmatn', Tahoma; font-size: 14px;
    margin-bottom: 12px; transition: all 0.3s;
  }
  .modal-input:focus, .modal-textarea:focus, .modal-select:focus {
    outline: none; border-color: white;
  }
  .modal-textarea { resize: vertical; min-height: 80px; }
  .modal-input::placeholder, .modal-textarea::placeholder { color: rgba(255,255,255,0.5); }
  .modal-select option { background: #333; color: white; }
  .modal-buttons { display: flex; gap: 10px; margin-top: 10px; }
  .modal-buttons .btn { flex: 1; }

  /* ===== لیست کارت‌ها ===== */
  .card-list { max-height: 400px; overflow-y: auto; margin-top: 15px; padding: 5px; }
  .card-item {
    background: linear-gradient(135deg, rgba(255,255,255,0.15), rgba(255,255,255,0.05));
    border: 2px solid rgba(255,255,255,0.25);
    border-radius: 18px; padding: 15px; margin-bottom: 12px;
    display: flex; justify-content: space-between; align-items: center;
    gap: 10px; box-shadow: 0 8px 25px rgba(0,0,0,0.2);
    transition: all 0.3s; position: relative; overflow: hidden;
  }
  .card-item::before {
    content: ""; position: absolute; top: 0; right: 0;
    width: 5px; height: 100%;
    background: linear-gradient(180deg, var(--theme-accent), var(--theme-primary));
  }
  .card-item:hover { transform: translateX(-5px); box-shadow: 0 12px 35px rgba(0,0,0,0.3); }
  .card-item-info { flex: 1; min-width: 0; }
  .card-item-q {
    font-size: 14px; font-weight: bold; margin-bottom: 5px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .card-item-a {
    font-size: 12px; color: rgba(255,255,255,0.8);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    margin-bottom: 5px;
  }
  .card-item-meta {
    display: flex; gap: 8px; font-size: 10px;
    color: rgba(255,255,255,0.7); flex-wrap: wrap;
  }
  .card-item-category {
    background: rgba(255,255,255,0.2); padding: 2px 8px; border-radius: 6px;
  }
  .card-item-actions { display: flex; gap: 5px; flex-direction: column; }
  .action-btn {
    background: rgba(255,255,255,0.15);
    border: 1px solid rgba(255,255,255,0.3);
    color: white; border-radius: 8px;
    padding: 6px 10px; cursor: pointer; font-size: 13px;
    transition: all 0.3s;
  }
  .action-btn:hover { background: rgba(255,255,255,0.3); }
  .action-btn.delete {
    background: rgba(255,80,80,0.3);
    border-color: rgba(255,80,80,0.5);
  }
  .action-btn.delete:hover { background: rgba(255,80,80,0.6); }

  /* ===== جستجو ===== */
  .search-box {
    width: 100%; padding: 12px 16px; border-radius: 12px;
    border: 2px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.2);
    color: white; font-family: 'Vazirmatn', Tahoma; font-size: 14px;
    margin-bottom: 12px;
  }
  .search-box:focus { outline: none; border-color: white; }
  .search-box::placeholder { color: rgba(255,255,255,0.5); }

  /* ===== فیلتر دسته‌بندی ===== */
  .category-filter { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
  .cat-chip {
    padding: 6px 14px; background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.2); border-radius: 20px;
    color: white; font-family: 'Vazirmatn', Tahoma; font-size: 12px;
    cursor: pointer; transition: all 0.3s;
  }
  .cat-chip:hover { background: rgba(255,255,255,0.2); }
  .cat-chip.active {
    background: rgba(255,255,255,0.9);
    color: var(--theme-primary); font-weight: bold;
  }

  /* ===== پیام خالی ===== */
  .empty { text-align: center; padding: 40px 20px; color: rgba(255,255,255,0.7); }
  .empty-icon { font-size: 60px; margin-bottom: 15px; }

  /* ===== نوتیفیکیشن ===== */
  .notification {
    position: fixed; top: 20px; left: 50%;
    transform: translateX(-50%) translateY(-100px);
    background: linear-gradient(135deg, #00b894, #00cec9);
    color: white; padding: 12px 25px; border-radius: 12px;
    font-weight: bold; z-index: 200; transition: transform 0.4s;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
  }
  .notification.visible { transform: translateX(-50%) translateY(0); }

  /* ===== تم پیکر ===== */
  .theme-picker {
    display: flex; gap: 6px; justify-content: center;
    margin-bottom: 20px; flex-wrap: wrap;
  }
  .theme-dot {
    width: 32px; height: 32px; border-radius: 50%; cursor: pointer;
    border: 3px solid rgba(255,255,255,0.3); transition: all 0.3s;
  }
  .theme-dot:hover { transform: scale(1.15); }
  .theme-dot.active {
    border-color: white; box-shadow: 0 0 15px rgba(255,255,255,0.8);
    transform: scale(1.2);
  }
  .theme-dot.purple { background: linear-gradient(135deg, #667eea, #764ba2); }
  .theme-dot.green { background: linear-gradient(135deg, #11998e, #38ef7d); }
  .theme-dot.blue { background: linear-gradient(135deg, #2193b0, #6dd5ed); }
  .theme-dot.pink { background: linear-gradient(135deg, #ee9ca7, #fbc2eb); }
  .theme-dot.orange { background: linear-gradient(135deg, #f12711, #f5af19); }
  .theme-dot.dark { background: linear-gradient(135deg, #0f0c29, #302b63); }

  /* ===== دستاوردها ===== */
  .achievements-grid {
    display: grid; grid-template-columns: repeat(2, 1fr);
    gap: 10px; margin-top: 15px;
  }
  .achievement {
    background: rgba(0,0,0,0.25); border-radius: 15px;
    padding: 15px; text-align: center;
    border: 2px solid rgba(255,255,255,0.1);
    transition: all 0.3s; position: relative;
  }
  .achievement.locked { opacity: 0.4; filter: grayscale(1); }
  .achievement.unlocked {
    border-color: #ffd700;
    box-shadow: 0 0 20px rgba(255,215,0,0.3);
  }
  .achievement-icon { font-size: 40px; margin-bottom: 8px; }
  .achievement-title { font-size: 13px; font-weight: bold; margin-bottom: 4px; }
  .achievement-desc { font-size: 10px; color: rgba(255,255,255,0.7); }

  /* ===== اسکرول‌بار ===== */
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.3); border-radius: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }

  /* ===== اشتراک‌گذاری ===== */
  .share-buttons {
    display: grid; grid-template-columns: repeat(2, 1fr);
    gap: 10px; margin-top: 15px;
  }
  .share-btn {
    padding: 12px; border-radius: 12px; border: none;
    font-family: 'Vazirmatn', Tahoma; font-size: 13px;
    font-weight: bold; cursor: pointer; transition: all 0.3s;
    display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  .share-btn:hover { transform: translateY(-2px); }
  .share-whatsapp { background: #25D366; color: white; }
  .share-telegram { background: #0088cc; color: white; }
  .share-copy { background: rgba(255,255,255,0.2); color: white; border: 1px solid rgba(255,255,255,0.3); }
  .share-native { background: linear-gradient(135deg, #667eea, #764ba2); color: white; }

  /* ===== PWA نصب ===== */
  .install-banner {
    display: none;
    background: linear-gradient(135deg, #00b894, #00cec9);
    border-radius: 15px; padding: 15px; margin-bottom: 15px;
    text-align: center; animation: slideDown 0.5s;
  }
  .install-banner.visible { display: block; }
  @keyframes slideDown {
    from { transform: translateY(-20px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }
  .install-banner p { font-size: 13px; margin-bottom: 10px; }
  .install-banner .btn {
    background: white; color: #00b894; font-size: 13px;
    padding: 10px 20px;
  }

  @media (max-width: 480px) {
    .container { padding: 20px; }
    .card-text { font-size: 20px; }
    .greeting { font-size: 15px; }
    .bottom-menu { grid-template-columns: repeat(2, 1fr); }
    .achievements-grid { grid-template-columns: 1fr; }
  }
</style>
</head>

  // ===== متغیرهای اصلی =====
  let userName = localStorage.getItem('fc_username') || '';
  let cards = JSON.parse(localStorage.getItem('fc_cards') || '[]');
  let currentTheme = localStorage.getItem('fc_theme') || 'purple';

  let sessionStats = { right: 0, wrong: 0 };
  let reminderEnabled = localStorage.getItem('fc_reminder') === 'true';
  let reminderTime = localStorage.getItem('fc_reminder_time') || '20:00';
  let currentCategory = 'all';

  let triedThemes = JSON.parse(localStorage.getItem('fc_tried_themes') || '["purple"]');
  let practiceStreak = JSON.parse(localStorage.getItem('fc_streak') || '{"days":[],"count":0}');
  let deferredPrompt = null;

  // ===== تابع ترجمه =====
  function t(key) {
    return TRANSLATIONS[currentLang][key] || key;
  }

  // ===== تم =====
  function setTheme(theme) {
    document.body.className = 'theme-' + theme + (currentLang === 'en' ? ' lang-en' : '');
    currentTheme = theme;
    localStorage.setItem('fc_theme', theme);
    if (!triedThemes.includes(theme)) {
      triedThemes.push(theme);
      localStorage.setItem('fc_tried_themes', JSON.stringify(triedThemes));
      checkAchievements();
    }
  }

  // ===== زبان =====
  function setLang(lang) {
    currentLang = lang;
    localStorage.setItem('fc_lang', lang);
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === 'fa' ? 'rtl' : 'ltr';
    document.body.className = 'theme-' + currentTheme + (lang === 'en' ? ' lang-en' : '');
    renderApp();
  }

  setTheme(currentTheme);
  document.documentElement.lang = currentLang;
  document.documentElement.dir = currentLang === 'fa' ? 'rtl' : 'ltr';

  // ===== ذخیره =====
  function saveCards() {
    localStorage.setItem('fc_cards', JSON.stringify(cards));
  }

  // ===== نوتیفیکیشن =====
  function notify(text) {
    const n = document.getElementById('notification');
    n.textContent = text;
    n.classList.add('visible');
    setTimeout(() => n.classList.remove('visible'), 2000);
  }

  // ===== تکرار فاصله‌دار =====
  function getNextCard() {
    if (cards.length === 0) return null;
    const filtered = currentCategory === 'all'
      ? cards
      : cards.filter(c => (c.category || 'عمومی') === currentCategory);
    if (filtered.length === 0) return null;
    const sorted = [...filtered].sort((a, b) => {
      const scoreA = (a.level || 0) * 10 - (a.rightCount || 0) + (a.wrongCount || 0) * 5;
      const scoreB = (b.level || 0) * 10 - (b.rightCount || 0) + (b.wrongCount || 0) * 5;
      return scoreA - scoreB;
    });
    return sorted[0];
  }

  // ===== دستاوردها =====
  const ACHIEVEMENTS = [
    { id: 'first', icon: '🌱', title: 'ach_first', desc: 'ach_first_desc', check: () => cards.length >= 1 },
    { id: 'ten', icon: '🌿', title: 'ach_ten', desc: 'ach_ten_desc', check: () => cards.length >= 10 },
    { id: 'fifty', icon: '🌳', title: 'ach_fifty', desc: 'ach_fifty_desc', check: () => cards.length >= 50 },
    { id: 'master', icon: '🎓', title: 'ach_master', desc: 'ach_master_desc', check: () => cards.filter(c => (c.level || 0) >= 5).length >= 5 },
    { id: 'streak', icon: '🔥', title: 'ach_streak', desc: 'ach_streak_desc', check: () => practiceStreak.count >= 7 },
    { id: 'hundred', icon: '💯', title: 'ach_hundred', desc: 'ach_hundred_desc', check: () => cards.reduce((s, c) => s + (c.rightCount || 0), 0) >= 100 },
    { id: 'categories', icon: '📂', title: 'ach_categories', desc: 'ach_categories_desc', check: () => new Set(cards.map(c => c.category || 'عمومی')).size >= 3 },
    { id: 'theme', icon: '🌈', title: 'ach_theme', desc: 'ach_theme_desc', check: () => triedThemes.length >= 6 }
  ];

  function checkAchievements() {
    let newUnlocks = [];
    ACHIEVEMENTS.forEach(ach => {
      if (!unlockedAchievements.includes(ach.id) && ach.check()) {
        unlockedAchievements.push(ach.id);
        newUnlocks.push(ach);
      }
    });
    if (newUnlocks.length > 0) {
      localStorage.setItem('fc_achievements', JSON.stringify(unlockedAchievements));
      newUnlocks.forEach((ach, i) => {
        setTimeout(() => {
          notify(`🏆 ${t(ach.title)}`);
        }, i * 1500);
      });
    }
  }

  // ===== استریک =====
  function updateStreak() {
    const today = new Date().toDateString();
    if (!practiceStreak.days.includes(today)) {
      practiceStreak.days.push(today);
      // فقط ۳۰ روز آخر رو نگه دار
      if (practiceStreak.days.length > 30) practiceStreak.days = practiceStreak.days.slice(-30);
      // محاسبه‌ی استریک
      let count = 0;
      const sorted = [...practiceStreak.days].sort((a, b) => new Date(b) - new Date(a));
      for (let i = 0; i < sorted.length; i++) {
        const expected = new Date();
        expected.setDate(expected.getDate() - i);
        if (sorted[i] === expected.toDateString()) count++;
        else break;
      }
      practiceStreak.count = count;
      localStorage.setItem('fc_streak', JSON.stringify(practiceStreak));
      checkAchievements();
    }
  }

  // ===== یادآور =====
  function requestNotificationPermission() {
    if (!('Notification' in window)) {
      notify(t('notSupported'));
      return;
    }
    Notification.requestPermission().then(permission => {
      if (permission === 'granted') {
        reminderEnabled = true;
        localStorage.setItem('fc_reminder', 'true');
        notify(t('reminderOn'));
        scheduleReminder();
      } else {
        notify(t('permissionDenied'));
      }
    });
  }

  function scheduleReminder() {
    if (!reminderEnabled) return;
    setInterval(() => {
      const now = new Date();
      const currentTime = now.getHours().toString().padStart(2, '0') + ':' +
                          now.getMinutes().toString().padStart(2, '0');
      if (currentTime === reminderTime) {
        const lastReminder = localStorage.getItem('fc_last_reminder');
        const today = now.toDateString();
        if (lastReminder !== today) {
          new Notification('🧠 ' + t('title'), {
            body: `${userName} ${currentLang === 'fa' ? 'جان،' : ','} ${currentLang === 'fa' ? 'وقت تمرین فلش‌کارت‌هاست!' : 'time to practice flashcards!'}`
          });
          localStorage.setItem('fc_last_reminder', today);
        }
      }
    }, 60000);
  }

  function disableReminder() {
    reminderEnabled = false;
    localStorage.setItem('fc_reminder', 'false');
    notify(t('reminderOff'));
  }

  // ===== اشتراک‌گذاری =====
  function shareApp(method) {
    const appUrl = window.location.href;
    const shareText = currentLang === 'fa' 
      ? '🧠 فلش‌کارت هوشمند - بهترین اپ برای حفظ کردن! امتحانش کن:'
      : '🧠 Smart Flashcards - Best app for memorization! Try it:';
    
    if (method === 'whatsapp') {
      window.open(`https://wa.me/?text=${encodeURIComponent(shareText + ' ' + appUrl)}`, '_blank');
    } else if (method === 'telegram') {
      window.open(`https://t.me/share/url?url=${encodeURIComponent(appUrl)}&text=${encodeURIComponent(shareText)}`, '_blank');
    } else if (method === 'copy') {
      navigator.clipboard.writeText(appUrl).then(() => {
        notify(t('copied'));
      }).catch(() => {
        // روش قدیمی
        const input = document.createElement('input');
        input.value = appUrl;
        document.body.appendChild(input);
        input.select();
        document.execCommand('copy');
        document.body.removeChild(input);
        notify(t('copied'));
      });
    } else if (method === 'native') {
      if (navigator.share) {
        navigator.share({
          title: t('title'),
          text: shareText,
          url: appUrl
        }).catch(() => {});
      } else {
        shareApp('copy');
      }
    }
  }

  // ===== PWA نصب =====
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    const banner = document.getElementById('installBanner');
    if (banner) banner.classList.add('visible');
  });

  function installPWA() {
    if (deferredPrompt) {
      deferredPrompt.prompt();
      deferredPrompt.userChoice.then((choice) => {
        if (choice.outcome === 'accepted') {
          notify('✅ ' + (currentLang === 'fa' ? 'اپ نصب شد!' : 'App installed!'));
        }
        deferredPrompt = null;
        const banner = document.getElementById('installBanner');
        if (banner) banner.classList.remove('visible');
      });
    }
  }

  function renderNameScreen() {
    document.getElementById('app').innerHTML = `
      <div class="name-screen">
        <h1>${t('title')}</h1>

        </div>
      </div>

    setTimeout(() => {
      const input = document.getElementById('nameInput');
      if (input) {
        input.focus();

  function saveName() {
    const name = document.getElementById('nameInput').value.trim();
    if (!name) {
      notify(t('writeName'));
      return;

    userName = name;
    localStorage.setItem('fc_username', name);

  // ===== تم پیکر =====
  function renderThemePicker() {
    const themes = ['purple', 'green', 'blue', 'pink', 'orange', 'dark'];

      <div class="theme-picker">
        ${themes.map(th => `

      app.innerHTML = `
        <div class="header">
          <div class="greeting">${t('hello')} <span>${userName}</span> 👋</div>
          <div class="header-actions">

    const totalLevel = cards.reduce((sum, c) => sum + (c.level || 0), 0);
    const maxLevel = cards.length * 5;
    const progress = maxLevel > 0 ? (totalLevel / maxLevel) * 100 : 0;

    if (!card) {

        <div class="header">
          <div class="greeting">${t('hello')} <span>${userName}</span> 👋</div>

          <div class="card-face card-front">

  // ===== برگرداندن کارت =====
  function flipCard() {
    const card = document.getElementById('card');
    card.classList.toggle('flipped');
    if (card.classList.contains('flipped')) {
      document.getElementById('answerButtons').classList.remove('hidden');
    } else {
      document.getElementById('answerButtons').classList.add('hidden');
    }
  }

  // ===== پاسخ =====
  function answerCard(isRight) {
    const card = getNextCard();
    if (!card) return;
    const cardInArray = cards.find(c => c.id === card.id);
    if (isRight) {
      cardInArray.rightCount = (cardInArray.rightCount || 0) + 1;
      cardInArray.level = Math.min(5, (cardInArray.level || 0) + 1);
      sessionStats.right++;
      notify(t('great'));
    } else {
      cardInArray.wrongCount = (cardInArray.wrongCount || 0) + 1;
      cardInArray.level = Math.max(0, (cardInArray.level || 0) - 1);
      sessionStats.wrong++;
      notify(t('tryAgain'));
    }
    saveCards();
    checkAchievements();
    renderApp();
  }

  // ===== اضافه/ویرایش کارت =====
  function openAddModal(editId = null) {
    const editing = editId !== null;
    const card = editing ? cards.find(c => c.id === editId) : null;

    const modal = document.createElement('div');
    modal.className = 'modal visible';
    modal.id = 'addModal';
    modal.innerHTML = `
      <div class="modal-content">
        <h2>${editing ? t('editCard') : t('newFlashcard')}</h2>
        <input type="text" class="modal-input" id="newQuestion" placeholder="${t('questionPlaceholder')}" maxlength="100" value="${editing ? escapeHtml(card.question) : ''}">
        <textarea class="modal-textarea" id="newAnswer" placeholder="${t('answerPlaceholder')}" maxlength="300">${editing ? escapeHtml(card.answer) : ''}</textarea>
        <input type="text" class="modal-input" id="newCategory" placeholder="${t('categoryPlaceholder')}" maxlength="20" value="${editing ? escapeHtml(card.category || '') : ''}">
        <div class="modal-buttons">
          <button class="btn btn-secondary" onclick="closeModal('addModal')">${t('cancel')}</button>
          <button class="btn btn-rainbow" onclick="saveCard(${editing ? editId : 'null'})">${t('save')}</button>
        </div>
      </div>
    `;
    document.body.appendChild(modal);
    setTimeout(() => document.getElementById('newQuestion').focus(), 100);
  }

  function saveCard(editId) {
    const q = document.getElementById('newQuestion').value.trim();
    const a = document.getElementById('newAnswer').value.trim();
    const cat = document.getElementById('newCategory').value.trim() || (currentLang === 'fa' ? 'عمومی' : 'General');

    if (!q || !a) {
      notify(t('fillBoth'));
      return;
    }

    if (editId !== null) {
      const card = cards.find(c => c.id === editId);
      if (card) {
        card.question = q;
        card.answer = a;
        card.category = cat;
      }
      notify(t('edited'));
    } else {
      cards.push({
        id: Date.now(),
        question: q,
        answer: a,
        category: cat,
        level: 0,
        rightCount: 0,
        wrongCount: 0
      });
      notify(t('added'));
    }

    saveCards();
    closeModal('addModal');
    checkAchievements();
    renderApp();
  }

  // ===== لیست =====
  function openListModal() {
    const categories = ['all', ...new Set(cards.map(c => c.category || (currentLang === 'fa' ? 'عمومی' : 'General')))];

    const modal = document.createElement('div');
    modal.className = 'modal visible';
    modal.id = 'listModal';
    modal.innerHTML = `
      <div class="modal-content">
        <h2>${t('listTitle')} (${cards.length})</h2>
        <input type="text" class="search-box" id="searchBox" placeholder="${t('search')}" oninput="filterList()">
        <div class="category-filter" id="categoryFilter">
          ${categories.map(cat => `
            <div class="cat-chip ${cat === currentCategory ? 'active' : ''}" onclick="setCategory('${cat}', event)">
              ${cat === 'all' ? t('all') : cat}
            </div>
          `).join('')}
        </div>
        <div class="card-list" id="cardList">
          ${renderCardList()}
        </div>
        <div class="modal-buttons" style="margin-top: 15px;">
          <button class="btn btn-secondary" onclick="closeModal('listModal')">${t('close')}</button>
        </div>
      </div>
    `;
    document.body.appendChild(modal);
  }

  function renderCardList() {
    const search = (document.getElementById('searchBox')?.value || '').toLowerCase();
    let filtered = cards;
    if (currentCategory !== 'all') {
      filtered = filtered.filter(c => (c.category || (currentLang === 'fa' ? 'عمومی' : 'General')) === currentCategory);
    }
    if (search) {
      filtered = filtered.filter(c =>
        c.question.toLowerCase().includes(search) ||
        c.answer.toLowerCase().includes(search)
      );
    }

    if (filtered.length === 0) {
      return `<p style="text-align:center; padding:20px; color:#aaa;">${t('noResults')}</p>`;
    }

    return filtered.map(card => `
      <div class="card-item">
        <div class="card-item-info">
          <div class="card-item-q">❓ ${escapeHtml(card.question)}</div>
          <div class="card-item-a">✅ ${escapeHtml(card.answer)}</div>
          <div class="card-item-meta">
            <span class="card-item-category">${escapeHtml(card.category || (currentLang === 'fa' ? 'عمومی' : 'General'))}</span>
            <span>${t('level')} ${card.level || 0}/5 · ✅ ${card.rightCount || 0} · ❌ ${card.wrongCount || 0}</span>
          </div>
        </div>
        <div class="card-item-actions">
          <button class="action-btn" onclick="closeModal('listModal'); openAddModal(${card.id})">✏️</button>
          <button class="action-btn delete" onclick="deleteCard(${card.id})">🗑️</button>
        </div>
      </div>
    `).join('');
  }

  function filterList() {
    const list = document.getElementById('cardList');
    if (list) list.innerHTML = renderCardList();
  }

  function setCategory(cat, event) {
    currentCategory = cat;
    const chips = document.querySelectorAll('.cat-chip');
    chips.forEach(chip => chip.classList.remove('active'));
    if (event) event.target.classList.add('active');
    filterList();
  }

  function deleteCard(id) {
    if (!confirm(t('confirmDelete'))) return;
    cards = cards.filter(c => c.id !== id);
    saveCards();
    closeModal('listModal');
    notify(t('deleted'));
    renderApp();
  }

  // ===== تنظیمات =====
  function openSettingsModal() {
    const modal = document.createElement('div');
    modal.className = 'modal visible';
    modal.id = 'settingsModal';
    modal.innerHTML = `
      <div class="modal-content">
        <h2>${t('settingsTitle')}</h2>

        <div style="background: rgba(0,0,0,0.2); border-radius: 15px; padding: 15px; margin-bottom: 15px;">
          <h3 style="font-size: 15px; margin-bottom: 10px;">${t('language')}</h3>
          <div class="modal-buttons">
            <button class="btn ${currentLang === 'fa' ? 'btn-rainbow' : 'btn-secondary'}" onclick="setLang('fa'); closeModal('settingsModal'); openSettingsModal();">🇮🇷 فارسی</button>
            <button class="btn ${currentLang === 'en' ? 'btn-rainbow' : 'btn-secondary'}" onclick="setLang('en'); closeModal('settingsModal'); openSettingsModal();">🇬🇧 English</button>
          </div>
        </div>

        <div style="background: rgba(0,0,0,0.2); border-radius: 15px; padding: 15px; margin-bottom: 15px;">
          <h3 style="font-size: 15px; margin-bottom: 10px;">${t('theme')}</h3>
          ${renderThemePicker()}
        </div>

        <div style="background: rgba(0,0,0,0.2); border-radius: 15px; padding: 15px; margin-bottom: 15px;">
          <h3 style="font-size: 15px; margin-bottom: 10px;">${t('dailyReminder')}</h3>
          <p style="font-size: 12px; color: rgba(255,255,255,0.8); margin-bottom: 12px;">${t('reminderDesc')}</p>
          <input type="time" class="modal-input" id="reminderTime" value="${reminderTime}" style="margin-bottom: 10px;">
          ${reminderEnabled ? `
            <button class="btn btn-secondary btn-full" onclick="disableReminder(); closeModal('settingsModal'); openSettingsModal();">${t('disableReminder')}</button>
          ` : `
            <button class="btn btn-rainbow btn-full" onclick="saveReminderTime(); requestNotificationPermission(); closeModal('settingsModal');">${t('enableReminder')}</button>
          `}
        </div>

        <div style="background: rgba(0,0,0,0.2); border-radius: 15px; padding: 15px; margin-bottom: 15px;">
          <h3 style="font-size: 15px; margin-bottom: 10px;">${t('achievements')}</h3>
          <div class="achievements-grid">
            ${ACHIEVEMENTS.map(ach => `
              <div class="achievement ${unlockedAchievements.includes(ach.id) ? 'unlocked' : 'locked'}">
                <div class="achievement-icon">${ach.icon}</div>
                <div class="achievement-title">${t(ach.title)}</div>
                <div class="achievement-desc">${t(ach.desc)}</div>
              </div>
            `).join('')}
          </div>
        </div>

        <div style="background: rgba(0,0,0,0.2); border-radius: 15px; padding: 15px; margin-bottom: 15px;">
          <h3 style="font-size: 15px; margin-bottom: 10px;">${t('share')}</h3>
          <p style="font-size: 12px; color: rgba(255,255,255,0.8); margin-bottom: 12px;">${t('shareDesc')}</p>
          <div class="share-buttons">
            <button class="share-btn share-whatsapp" onclick="shareApp('whatsapp')">📱 ${t('shareWhatsapp')}</button>
            <button class="share-btn share-telegram" onclick="shareApp('telegram')">✈️ ${t('shareTelegram')}</button>
            <button class="share-btn share-copy" onclick="shareApp('copy')">${t('shareCopy')}</button>
            <button class="share-btn share-native" onclick="shareApp('native')">${t('shareNative')}</button>
          </div>
        </div>

        <div style="background: rgba(0,0,0,0.2); border-radius: 15px; padding: 15px; margin-bottom: 15px;">
          <h3 style="font-size: 15px; margin-bottom: 10px;">${t('backup')}</h3>
          <div class="modal-buttons" style="flex-direction: column;">
            <button class="btn btn-secondary btn-full" onclick="exportCards()">${t('export')}</button>
            <button class="btn btn-secondary btn-full" onclick="document.getElementById('importFile').click()">${t('import')}</button>
            <input type="file" id="importFile" accept=".json" style="display:none" onchange="importCards(event)">
          </div>
        </div>

        <div style="background: rgba(255,80,80,0.15); border: 1px solid rgba(255,80,80,0.3); border-radius: 15px; padding: 15px; margin-bottom: 15px;">
          <h3 style="font-size: 15px; margin-bottom: 10px;">${t('dangerZone')}</h3>
          <button class="btn btn-full" style="background: rgba(255,80,80,0.6); color: white;" onclick="resetAll()">${t('resetAll')}</button>
        </div>

        <div class="modal-buttons">
          <button class="btn btn-secondary" onclick="closeModal('settingsModal')">${t('close')}</button>
        </div>
      </div>
    `;
    document.body.appendChild(modal);
  }

  function saveReminderTime() {
    reminderTime = document.getElementById('reminderTime').value;
    localStorage.setItem('fc_reminder_time', reminderTime);
  }

  function exportCards() {
    const data = JSON.stringify({ cards, userName, exportedAt: new Date().toISOString() }, null, 2);
    const blob = new Blob([data], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `flashcards-backup-${Date.now()}.json`;
    a.click();
    URL.revokeObjectURL(url);
    notify(t('exported'));
  }

  function importCards(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const data = JSON.parse(e.target.result);
        if (data.cards && Array.isArray(data.cards)) {
          if (confirm(t('confirmReplace'))) {
            cards = data.cards;
            saveCards();
            closeModal('settingsModal');
            notify(t('imported'));
            renderApp();
          }
        } else {
          notify(t('invalidFile'));
        }
      } catch (err) {
        notify(t('fileError'));
      }
    };
    reader.readAsText(file);
  }

  function resetAll() {
    if (!confirm(t('confirmReset'))) return;
    if (!confirm(t('confirmReset2'))) return;
    localStorage.clear();
    location.reload();
  }

  // ===== بستن مودال =====
  function closeModal(id) {
    const modal = document.getElementById(id);
    if (modal) modal.remove();
  }

  // ===== امنیت =====
  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  // ===== PWA Manifest داینامیک =====
  const manifest = {
    name: "Smart Flashcards",
    short_name: "FlashCards",
    description: "Smart flashcard app for memorization",
    start_url: ".",
    display: "standalone",
    background_color: "#667eea",
    theme_color: "#667eea",
    orientation: "portrait",
    icons: [
      {
        src: "data:image/svg+xml," + encodeURIComponent("<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23667eea'/><text y='.9em' font-size='80' x='50%' text-anchor='middle'>🧠</text></svg>"),
        sizes: "512x512",
        type: "image/svg+xml",
        purpose: "any maskable"
      }
    ]
  };
  const manifestBlob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
  document.getElementById('manifestPlaceholder').href = URL.createObjectURL(manifestBlob);

  // ===== Service Worker داینامیک =====
  if ('serviceWorker' in navigator) {
    const swCode = `
      const CACHE = 'flashcards-v1';
      self.addEventListener('install', e => {
        self.skipWaiting();
      });
      self.addEventListener('activate', e => {
        e.waitUntil(clients.claim());
      });
      self.addEventListener('fetch', e => {
        e.respondWith(
          caches.match(e.request).then(r => r || fetch(e.request).then(res => {
            const clone = res.clone();
            caches.open(CACHE).then(c => c.put(e.request, clone));
            return res;
          }).catch(() => caches.match(e.request)))
        );
      });
    `;
    const swBlob = new Blob([swCode], { type: 'application/javascript' });
    navigator.serviceWorker.register(URL.createObjectURL(swBlob)).catch(() => {});
  }

  // ===== شروع =====
  if (!userName) {
    renderNameScreen();
  } else {
    renderApp();
  }

  if (reminderEnabled) scheduleReminder();
</script>

</body>
</html>
